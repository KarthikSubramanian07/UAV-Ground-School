name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.16.10"  # pinned so a ruff release cannot change formatting under us
      - run: ruff check week02 week03 week04 week05 tests scripts
      - name: Formatting
        run: ruff format --check week02 week03 week04 week05 tests scripts
      - name: No em or en dashes in tracked text
        run: |
          if git grep -nIP '[\x{2013}\x{2014}]' -- . ':!*.pdf'; then
            echo "Found an em or en dash"; exit 1
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          pip install opencv-python-headless numpy pytest pytest-cov scikit-image pymavlink dronecan pyrtcm
          pip install -e . --no-deps
      - name: MAVLink XML pinned by ArduPilot Copter-4.7.1
        run: |
          mkdir -p build/mavlink
          for f in ardupilotmega common minimal standard uAvionix icarous loweheiser cubepilot csAirLink; do
            curl -fsSL "https://raw.githubusercontent.com/mavlink/mavlink/288b907c384a892c8519bfe271682424b1e1a3a0/message_definitions/v1.0/$f.xml" -o build/mavlink/$f.xml
          done
      - name: Test
        env:
          MAVLINK_XML_DIR: build/mavlink
        run: pytest --cov=week02 --cov=week03 --cov=week04 --cov=week05 --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage
          path: coverage.xml

  cpp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCV C++
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopencv-dev cmake g++
      - name: Build
        run: |
          cmake -S week02/cpp -B build/cpp -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cpp -j
          cmake -S week03/cpp -B build/cpp3 -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cpp3 -j
          cmake -S week04/cpp -B build/cpp4 -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cpp4 -j
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Parity with the Python implementation
        env:
          WEEK02_CPP_BUILD: build/cpp
          WEEK03_CPP_BUILD: build/cpp3
          WEEK04_CPP_BUILD: build/cpp4
        run: |
          pip install opencv-python-headless numpy pytest
          pip install -e . --no-deps
          pytest tests/test_cpp_parity.py tests/test_week03_cpp_parity.py tests/test_week04_cpp_parity.py -v

  ros:
    # ROS 2 Jazzy itself: build the workspace, run every package's linters and
    # launch tests, then hold week05 to the real middleware (interop with the
    # tutorial nodes over Fast DDS and Cyclone DDS, CDR, type hashes, QoS).
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install the workspace's dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ros-jazzy-example-interfaces ros-jazzy-vision-msgs ros-jazzy-rmw-cyclonedds-cpp python3-numpy python3-pytest
      - name: colcon build
        working-directory: ros2_ws
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_cohesion+
      - name: colcon test (linters, unit tests, launch tests)
        working-directory: ros2_ws
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
      - name: week05 against ROS 2
        run: |
          source /opt/ros/jazzy/setup.bash
          source ros2_ws/install/setup.bash
          python3 -m pytest -v -p no:cacheprovider --noconftest tests/test_week05_ros.py

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build showcase site
        run: |
          pip install opencv-python-headless numpy
          pip install -e . --no-deps
          python scripts/build_site.py --out build/site

  deploy:
    # Cloudflare Pages is Git connected but receives no push events from this
    # repo, so CI asks it to build main through a Deploy Hook once every check
    # above is green. The hook URL is the CLOUDFLARE_DEPLOY_HOOK secret.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, cpp, ros, site]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Cloudflare Pages production build
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          test -n "$HOOK" || { echo "CLOUDFLARE_DEPLOY_HOOK secret is not set"; exit 1; }
          curl -fsS -X POST "$HOOK"
          echo
          echo "Build requested for $GITHUB_SHA"
