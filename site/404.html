<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Off the flight path | UAV Ground School</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#15191c">
  <link rel="icon" href="{{CANONICAL}}favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400&amp;family=Schibsted+Grotesk:wght@400;600&amp;family=Young+Serif&amp;display=swap">
  <style>
    /* Self contained: Cloudflare Pages serves this file for any missing path, so relative asset URLs would not resolve. */
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: oklch(0.165 0.012 220);
      color: oklch(0.95 0.004 215);
      font-family: "Schibsted Grotesk", system-ui, sans-serif;
      line-height: 1.6;
    }
    main { max-width: 36rem; }
    svg { width: min(100%, 22rem); height: auto; display: block; margin-bottom: 2.5rem; overflow: visible; }
    .code { font-family: "Martian Mono", ui-monospace, monospace; font-size: 0.75rem; color: oklch(0.72 0.16 52); }
    h1 { font-family: "Young Serif", Georgia, serif; font-weight: 400; font-size: clamp(2.2rem, 1.5rem + 3vw, 3.4rem); line-height: 1.05; margin: 0.6rem 0 1rem; text-wrap: balance; }
    p { margin: 0; color: oklch(0.76 0.012 215); }
    a.button {
      display: inline-block; margin-top: 2rem; padding: 0.8rem 1.2rem; border-radius: 999px;
      background: oklch(0.72 0.16 52); color: oklch(0.18 0.02 50); font-weight: 600; text-decoration: none;
    }
    a.button:hover { background: oklch(0.78 0.15 55); }
    a:focus-visible { outline: 2px solid oklch(0.95 0.004 215); outline-offset: 3px; }
    @media (prefers-reduced-motion: no-preference) {
      .drone { animation: drift 6s cubic-bezier(0.16, 1, 0.3, 1) infinite alternate; }
      @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(-28px, 6px); } }
    }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 360 150" aria-hidden="true" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 30h240v45H20v45h240" stroke="oklch(0.32 0.014 220)" stroke-width="3" stroke-dasharray="2 10"/>
      <path d="M20 30h240v45H20v22" stroke="oklch(0.72 0.16 52)" stroke-width="3"/>
      <g class="drone">
        <rect x="282" y="18" width="60" height="38" rx="3" stroke="oklch(0.95 0.004 215)" stroke-width="2"/>
        <path d="M306 37h12M312 31v12" stroke="oklch(0.72 0.16 52)" stroke-width="2"/>
      </g>
    </svg>
    <p class="code">404, no keyframe matched</p>
    <h1>This page drifted off the flight path.</h1>
    <p>The address does not match anything on the site. Relocalize from the start.</p>
    <a class="button" href="{{CANONICAL}}">Back to UAV Ground School</a>
  </main>
</body>
</html>
