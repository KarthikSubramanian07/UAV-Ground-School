<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" class="wiring" role="img" aria-labelledby="wiring-title wiring-desc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
<title id="wiring-title">Protocol Pro wiring diagram</title>
<desc id="wiring-desc">A 500 mm RTK survey quad: Cube Orange+ flight controller, Here4 RTK GNSS on DroneCAN, Jetson Orin Nano companion on DDS and MAVLink, SIYI gimbal camera, ExpressLRS control and a 900 MHz telemetry link.</desc>
<style>.wiring{background:#12191d}.grid{stroke:#1b252a;stroke-width:1}.card rect{fill:#1a242a;stroke:#34444c;stroke-width:1.2}.card .t{fill:#eef2f3;font-size:14px;font-weight:600}.card .s{fill:#8fa3ab;font-size:10.5px}.fc rect{fill:#e86f2a;stroke:#ffb27a}.fc .t{fill:#1b1109;font-size:19px}.fc .s{fill:#3a1f0c}.pin{font-size:10px;fill:#2a1407;font-weight:600}.wire{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}.wire.power{stroke-width:4}.lbl{font-size:10.5px;fill:#dfe6e9;paint-order:stroke;stroke:#12191d;stroke-width:4px}.dot{stroke:#12191d;stroke-width:2}.ant{fill:none;stroke:#8fa3ab;stroke-width:1.3;stroke-dasharray:3 3}.legend text{font-size:11px;fill:#cfd8dc}</style>
