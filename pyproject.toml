[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-ground-school"
version = "0.2.0"
description = "UAVs@Berkeley Software Ground School 2026 solutions: OpenCV color segmentation, SUAS shape detection and drone video mosaicking."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Karthik Subramanian" }]
requires-python = ">=3.10"
keywords = ["opencv", "computer-vision", "uav", "drone", "image-stitching", "orthomosaic", "suas"]
dependencies = ["opencv-python>=4.8", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
week02 = "week02.cli:main"

[tool.setuptools.packages.find]
include = ["week02*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B905"]
